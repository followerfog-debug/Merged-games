name: Build APK

# Builds the app in GitHub's cloud and publishes the .apk as a Release you can download from a phone.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install NDK, CMake and platform
        run: sdkmanager "ndk;27.0.12077973" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

      - name: Fetch SDL, the Zelda engine and its content
        run: bash scripts/fetch-third-party.sh

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MergedGames-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish as a Release (direct .apk download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MergedGames.apk
          gh release create "build-${{ github.run_number }}" MergedGames.apk \
            --title "Build ${{ github.run_number }}" \
            --notes "Debug APK built from commit ${{ github.sha }}. Install it, allowing 'install unknown apps' if Android asks."
