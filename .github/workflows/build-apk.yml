name: Build APK

# Builds the app in GitHub's cloud and publishes the .apk as a Release you can download from a phone.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner image already ships the Android SDK ($ANDROID_HOME); we only add what we need.
      - name: Install NDK, CMake and platform
        run: |
          set -o pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;27.0.12077973" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0" 2>&1 | tee -a build.log

      - name: Fetch SDL, the Zelda engine and its content
        run: |
          set -o pipefail
          bash scripts/fetch-third-party.sh 2>&1 | tee -a build.log

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug 2>&1 | tee -a build.log

      # Logs can't always be downloaded, so on failure surface the error lines as annotations on the run.
      - name: Report errors
        if: failure()
        run: |
          [ -f build.log ] || { echo "::error title=No build log::the build failed before producing output"; exit 0; }
          msg=$(grep -n -i -E "error|FAILED|what went wrong|undefined reference|not found|could not" -A2 build.log \
                | head -50 | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build errors (first matches)::${msg}"
          tail -n 15 build.log | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' > tail.txt
          echo "::error title=Build log (last lines)::$(cat tail.txt)"

      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MergedGames-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish as a Release (direct .apk download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MergedGames.apk
          gh release create "build-${{ github.run_number }}" MergedGames.apk \
            --title "Build ${{ github.run_number }}" \
            --notes "Debug APK built from commit ${{ github.sha }}. Install it, allowing 'install unknown apps' if Android asks."
